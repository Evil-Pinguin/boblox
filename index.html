<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ROBLOX GAME JAM — создай свою игру за 2 дня</title>
  <meta name="description" content="Интерактивная презентация: смотри слайд, делай действие, получай часть своей игры.">
  <script>try{var t=localStorage.getItem('boblox-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css?v=26">
  <link rel="stylesheet" href="css/mobile.css?v=26">
</head>
<body>
  <div class="viewport" id="viewport">
    <div class="stage" id="stage">
      <header class="topbar">
        <div class="brand"><span class="brand-logo">▣</span> GAME JAM</div>
        <div class="section-tag" id="sectionTag"></div>
        <div class="top-actions">
          <span class="counter" id="counter"></span>
          <button class="reset-btn" id="btnResetTop" title="Начать всё заново">↺ Сброс</button>
          <button class="icon-btn theme-btn" id="btnTheme" title="Светлая / тёмная тема (T)" aria-label="Сменить тему">
            <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
            <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button class="icon-btn" id="btnBuild" title="Моя игра — все блоки (G)">🧱</button>
          <button class="icon-btn" id="btnFull" title="Во весь экран (F)">⛶</button>
        </div>
      </header>

      <div class="progress" id="progress">
        <div class="pg-text">ТВОЯ ИГРА СОБРАНА НА <b id="pgPct">0%</b></div>
        <nav class="bricks" id="bricks" aria-label="Прогресс игры"></nav>
        <div class="pg-count"><b id="pgNow">0</b>/<span id="pgTotal">25</span></div>
      </div>

      <main class="slide-area" id="slideArea"></main>

      <button class="nav-btn prev" id="prev" aria-label="Назад">‹</button>
      <button class="nav-btn next" id="next" aria-label="Дальше">›</button>

      <footer class="panel" id="panel"></footer>

      <div class="toast" id="toast" aria-live="polite"></div>
      <div class="confetti" id="confetti"></div>

      <div class="final" id="final" hidden></div>

      <div class="modal confirm" id="confirm" hidden>
        <div class="confirm-box">
          <div class="cf-ico">↺</div>
          <h3>Начать заново?</h3>
          <p>Все блоки, ответы и прогресс уроков Lua будут стёрты.</p>
          <div class="cf-btns">
            <button class="btn ghost" id="cfNo">Нет, оставить</button>
            <button class="btn cf-yes" id="cfYes">Да, стереть всё</button>
          </div>
        </div>
      </div>

      <div class="lesson" id="lesson" hidden></div>

      <div class="modal" id="modal" hidden>
        <div class="modal-box">
          <div class="modal-head">
            <h3>🧱 Моя игра — собрано <span id="mCount"></span></h3>
            <button class="icon-btn" id="mClose" aria-label="Закрыть">✕</button>
          </div>
          <div class="build-grid" id="buildGrid"></div>
          <div class="modal-foot">
            <button class="btn small ghost" id="btnReset">↺ Начать заново</button>
            <span class="hint">Клик по блоку — перейти к слайду</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/slides.js?v=26"></script>
  <script src="js/lessons.js?v=26"></script>
  <script src="js/app.js?v=26"></script>
  <script src="js/lesson-ui.js?v=26"></script>
</body>
</html>
